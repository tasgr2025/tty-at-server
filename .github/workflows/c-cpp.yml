name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          chmod +x install-deps.sh
          ./install-deps.sh

      - name: Build project
        run: |
          make clean
          make

      - name: Run tests
        run: |
          chmod +x test.sh
          ./test.sh

